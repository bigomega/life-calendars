<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Calendars</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sticky-top">
  <header class="app-header">
    <div class="header-row">
      <h1>Life Calendars</h1>
      <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="location">Location Calendar</button>
    </div>
  </header>

  <div class="controls-bar">
    <div class="control-group">
      <span class="title">People</span>
      <label class="person-chip" id="chip-B">
        <input type="checkbox" value="B" checked> Bharath ♂
      </label>
      <label class="person-chip" id="chip-M">
        <input type="checkbox" value="M" checked> Mariana ♀
      </label>
    </div>

    <div class="control-group">
      <span class="title">Year</span>
      <button id="year-prev">◀</button>
      <select id="year-select"></select>
      <button id="year-next">▶</button>
      <button id="btn-today">Today</button>
      <button id="btn-legend" aria-pressed="false" aria-controls="legend-panel">Legend</button>
    </div>

    <div class="spacer"></div>

    <div class="control-group">
      <button id="btn-add-location" class="primary">+ Add Location</button>
      <button id="btn-manage-locations">Manage Locations</button>
      <button id="btn-copy-json">Copy JSON</button>
      <button id="btn-reset" class="danger" title="Discard local edits, reload from data.json">Reset</button>
    </div>
  </div>

  <div class="legend-panel hidden" id="legend-panel"></div>
</div>

<main>
  <div id="years-container"></div>
</main>

<!-- Add / Edit location modal -->
<div class="overlay hidden" id="location-modal-overlay">
  <div class="modal">
    <h2 id="location-modal-title">Add Location</h2>
    <form id="location-form">
      <input type="hidden" id="f-id">

      <div class="form-row-inline">
        <div class="form-row">
          <label for="f-person">Person</label>
          <select id="f-person">
            <option value="B">Bharath</option>
            <option value="M">Mariana</option>
            <option value="Both">Both</option>
          </select>
        </div>
        <div class="form-row">
          <label for="f-type">Type</label>
          <select id="f-type">
            <option value="stay">Stay (location range)</option>
            <option value="flight">Flight</option>
            <option value="transit">Transit (other travel)</option>
          </select>
        </div>
      </div>

      <div class="form-row-inline">
        <div class="form-row">
          <label for="f-start">Start date</label>
          <input type="date" id="f-start" required>
        </div>
        <div class="form-row">
          <label for="f-end">End date</label>
          <input type="date" id="f-end" required>
        </div>
      </div>

      <div id="stay-fields">
        <div class="form-row-inline">
          <div class="form-row">
            <label for="f-location">Location</label>
            <input type="text" id="f-location" placeholder="e.g. Mumbai">
          </div>
          <div class="form-row">
            <label for="f-country">Country</label>
            <input type="text" id="f-country" placeholder="e.g. India">
          </div>
        </div>
      </div>

      <div id="route-fields">
        <div class="form-row-inline">
          <div class="form-row">
            <label for="f-from">From</label>
            <input type="text" id="f-from" placeholder="e.g. Delhi">
          </div>
          <div class="form-row">
            <label for="f-to">To</label>
            <input type="text" id="f-to" placeholder="e.g. NYC">
          </div>
        </div>
      </div>

      <div class="form-row-inline">
        <div class="form-row">
          <label for="f-label">Label</label>
          <input type="text" id="f-label" placeholder="Short description">
        </div>
        <div class="form-row">
          <label for="f-emoji">Emoji (optional)</label>
          <input type="text" id="f-emoji" placeholder="✈️">
        </div>
      </div>

      <div class="form-row">
        <label style="flex-direction: row; align-items: center; display:flex; gap:6px;">
          <input type="checkbox" id="f-cancelled" style="width:auto;"> Cancelled
        </label>
      </div>

      <div class="form-actions">
        <button type="button" id="f-delete" class="danger hidden">Delete</button>
        <div class="right">
          <button type="button" id="f-cancel">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Manage locations (table) modal -->
<div class="overlay hidden" id="manage-modal-overlay">
  <div class="modal" style="width:min(720px,94vw);">
    <h2>Manage Locations</h2>
    <div id="manage-list" style="max-height:60vh; overflow-y:auto;"></div>
    <div class="form-actions">
      <div></div>
      <div class="right">
        <button type="button" id="manage-close">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Copy JSON modal -->
<div class="overlay hidden" id="json-modal-overlay">
  <div class="modal json-modal" style="width:min(680px,94vw);">
    <h2>Current data.json</h2>
    <p class="hint">
      Copy this and paste it over <code>data.json</code> in the repo to open a PR with your changes, or
      <a id="json-edit-link" href="#" target="_blank" rel="noopener">open data.json on GitHub</a>
      and paste it there — GitHub will offer to start a PR for you.
    </p>
    <textarea id="json-output" readonly></textarea>
    <div class="form-actions">
      <div></div>
      <div class="right">
        <button type="button" id="json-copy-btn" class="primary">Copy to clipboard</button>
        <button type="button" id="json-close">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div class="overlay hidden" id="settings-modal-overlay">
  <div class="modal settings-modal" role="dialog" aria-labelledby="settings-title">
    <h2 id="settings-title">Settings</h2>
    <fieldset class="setting-block">
      <legend>Day boxes</legend>
      <label class="choice-card">
        <input type="radio" name="daybox" value="M">
        <span class="choice-copy">
          <span class="choice-title">daybox:M</span>
          <span class="choice-desc">Uncolored boxes, flag on every stay day</span>
        </span>
      </label>
      <label class="choice-card">
        <input type="radio" name="daybox" value="B">
        <span class="choice-copy">
          <span class="choice-title">daybox:B</span>
          <span class="choice-desc">Location colors, flag on the first day of each trip</span>
        </span>
      </label>
    </fieldset>
    <div class="form-actions">
      <div></div>
      <div class="right">
        <button type="button" id="settings-close">Close</button>
      </div>
    </div>
  </div>
</div>

<div id="day-popover" class="day-popover hidden"></div>
<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
